# Unterstützte Konfiguration des Entwicklungsstands 0.0.2.
# Kopieren nach config.yaml; mit --config config.yaml explizit laden.
# Unbekannte Felder und noch nicht implementierte Funktionen werden zurückgewiesen.
schema_version: 1

trigger:
  enabled: true
  key: ctrl_r # Zum Beispiel ctrl_r, f8, a, vk:186 oder mouse:x2
  mode: hold # hold: Loslassen verarbeitet; toggle: zweiter Druck verarbeitet
  device: null # Standardmikrofon; alternativ ID/Name aus `computerflow devices`
  device_hostapi: null # Die Auswahl speichert Gerätename und Host-API statt wechselnder IDs
  device_selected: false # Nach expliziter Auswahl true; erster interaktiver Start fragt sonst nach
  sample_rate: 16000 # 16 kHz, mono, PCM16
  max_recording_seconds: 30
  min_recording_ms: 250

wake:
  enabled: true # „Computer“; mit trigger.enabled getrennt schaltbar
  source: vosk
  model: null # Geprüftes Standardmodell; alternativ Vosk-Modellordner relativ zum Programmordner
  sensitivity: 0.65 # Höhere Werte erlauben unsicherere Wake-Treffer
  pre_roll_seconds: 2.0 # 2 bis 4 s RAM-Ringpuffer
  silence_seconds: 1.2 # Erlaubte Pause am Ende des Auftrags
  vad_mode: 2 # WebRTC VAD: 0–3, höhere Werte filtern stärker
  speech_stop: true # „Stopp“ oder „Abbrechen“ während Planung und Sprachausgabe
  verify_speaker: false # Opt-in über `Start-ComputerFlow.ps1 -Speaker enroll`
  speaker_similarity: 0.70

feedback:
  mode: brief # silent, brief oder conversational
  duck_percent: 0 # Optionale Absenkung anderer Windows-Sitzungen während Aufnahme/Ausgabe

model:
  backend: llama_cpp
  endpoint: http://127.0.0.1:47831 # Eigener Port; ausschließlich numerische Loopback-Adressen
  model_id: LiquidAI/LFM3-Omni-2B-GGUF # Muss mit dem Server-Alias übereinstimmen
  model_revision: null # Konkret verwendeten Hugging-Face-Commit festhalten
  runtime_revision: null # Konkret verwendeten llama.cpp-Build festhalten
  model_sha256: null # Optional: SHA-256 der lokal verwendeten GGUF-Datei
  quantization: null # Tatsächlich eingerichtete Quantisierung, z. B. Q4_K_M
  request_timeout_seconds: 60
  max_tokens: 512
  max_response_repairs: 1
  constrained_decoding: true # Bei nachgewiesener Backend-Inkompatibilität manuell false
  prompt_version: v3

runtime:
  managed: true # Installation/Start von llama.cpp, Modell und Projektor gehören zum Projekt
  data_dir: null # Standard: .computerflow/ im Programmordner, Alternativen innerhalb dieses Ordners
  acceleration: auto # auto: Vulkan praktisch prüfen, sonst sichtbarer CPU-Fallback
  device: null # Alternativ konkrete ID aus setup, z. B. Vulkan0
  startup_timeout_seconds: 120

execution:
  timeout_seconds: 90 # Einschließlich Aufnahme
  context_max_age_seconds: 90
  practice_mode: false # true: konkrete Aktion anzeigen und mit F6 freigeben
  confirmation_timeout_seconds: 30
  emergency_hotkey: ctrl+alt+escape # Alternativ ctrl+alt+f12
